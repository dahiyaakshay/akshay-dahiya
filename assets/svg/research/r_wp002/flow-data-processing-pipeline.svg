<svg viewBox="0 0 660 618" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="660" height="618" fill="#F4EFE6"/>
<line x1="34" y1="40" x2="34" y2="558" stroke="#A89A87" stroke-width="1.2" stroke-dasharray="3 5"/>
<circle cx="34" cy="40" r="13" fill="#1E1C19"/>
<text x="60" y="38" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">01 / PROMPT SUBMISSION</text>
<text x="60" y="58" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">Sent to AI platform via interface or API, response captured in full</text>
<circle cx="34" cy="114" r="13" stroke="#1E1C19" stroke-width="1.5" fill="#F4EFE6"/>
<text x="60" y="112" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">02 / CITATION EXTRACTION</text>
<text x="60" y="132" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">Citation URLs and source domains parsed from each response</text>
<circle cx="34" cy="188" r="13" stroke="#1E1C19" stroke-width="1.5" fill="#F4EFE6"/>
<text x="60" y="186" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">03 / HOP COUNTING</text>
<text x="60" y="206" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">A hop counted each time retrieval moves to a distinct second source domain</text>
<circle cx="34" cy="262" r="13" stroke="#1E1C19" stroke-width="1.5" fill="#F4EFE6"/>
<text x="60" y="260" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">04 / FAN-OUT ESTIMATION</text>
<text x="60" y="280" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">Distinct retrieval sub-queries counted or inferred from citations</text>
<circle cx="34" cy="336" r="13" stroke="#1E1C19" stroke-width="1.5" fill="#F4EFE6"/>
<text x="60" y="334" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">05 / EVIDENCE CHAIN TRACING</text>
<text x="60" y="354" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">Source-to-claim links traced across citations to build the chain</text>
<circle cx="34" cy="410" r="13" stroke="#1E1C19" stroke-width="1.5" fill="#F4EFE6"/>
<text x="60" y="408" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">06 / CROSS-DOMAIN FLAGGING</text>
<text x="60" y="428" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">Two or more distinct domains in one response flagged as cross-domain</text>
<circle cx="34" cy="484" r="13" stroke="#1E1C19" stroke-width="1.5" fill="#F4EFE6"/>
<text x="60" y="482" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">07 / SOURCE REUSE DETECTION</text>
<text x="60" y="502" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">Repeat citations of the same URL within a prompt batch identified</text>
<circle cx="34" cy="558" r="13" fill="#1E1C19"/>
<text x="60" y="556" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">08 / METRIC GENERATION</text>
<text x="60" y="576" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">MHCR, hop depth, fan-out, evidence chain length, and diversity computed</text>
</svg>