<svg viewBox="0 0 660 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="660" height="400" fill="#F4EFE6"/>
  <text x="0" y="26" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="500" fill="#1E1C19">MULTI-HOP CITATION RATE BY PLATFORM</text>

  <line x1="200" y1="55" x2="200" y2="375" stroke="#1E1C19" stroke-width="1.2"/>

  <!-- 7 rows, 45px pitch. scale: 59% -> ~380px max width -->
  <!-- Perplexity 59% -->
  <text x="190" y="70" text-anchor="end" font-family="Inter, sans-serif" font-size="12.5" fill="#3C3730">Perplexity</text>
  <rect x="200" y="59" width="380" height="18" fill="#1E1C19"/>
  <text x="588" y="73" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="500" fill="#1E1C19">59%</text>

  <!-- MS Copilot 54% -->
  <text x="190" y="115" text-anchor="end" font-family="Inter, sans-serif" font-size="12.5" fill="#3C3730">Microsoft Copilot</text>
  <rect x="200" y="104" width="348" height="18" fill="#1E1C19"/>
  <text x="556" y="118" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="500" fill="#1E1C19">54%</text>

  <!-- Gemini 48% -->
  <text x="190" y="160" text-anchor="end" font-family="Inter, sans-serif" font-size="12.5" fill="#3C3730">Gemini</text>
  <rect x="200" y="149" width="309" height="18" stroke="#7C6E5C" stroke-width="1.2" fill="#ECE5D8"/>
  <text x="517" y="163" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="500" fill="#1E1C19">48%</text>

  <!-- ChatGPT 44% -->
  <text x="190" y="205" text-anchor="end" font-family="Inter, sans-serif" font-size="12.5" fill="#3C3730">ChatGPT</text>
  <rect x="200" y="194" width="283" height="18" stroke="#7C6E5C" stroke-width="1.2" fill="#ECE5D8"/>
  <text x="491" y="208" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="500" fill="#1E1C19">44%</text>

  <!-- Qwen 41% -->
  <text x="190" y="250" text-anchor="end" font-family="Inter, sans-serif" font-size="12.5" fill="#3C3730">Qwen</text>
  <rect x="200" y="239" width="264" height="18" stroke="#7C6E5C" stroke-width="1.2" fill="#ECE5D8"/>
  <text x="472" y="253" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="500" fill="#1E1C19">41%</text>

  <!-- Claude 38% -->
  <text x="190" y="295" text-anchor="end" font-family="Inter, sans-serif" font-size="12.5" fill="#3C3730">Claude</text>
  <rect x="200" y="284" width="245" height="18" stroke="#7C6E5C" stroke-width="1.2" fill="#ECE5D8"/>
  <text x="453" y="298" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="500" fill="#1E1C19">38%</text>

  <!-- Google AI Overviews 32% -->
  <text x="190" y="340" text-anchor="end" font-family="Inter, sans-serif" font-size="12.5" fill="#3C3730">Google AI Overviews</text>
  <rect x="200" y="329" width="206" height="18" stroke="#A89A87" stroke-width="1.1" stroke-dasharray="2 3" fill="#ECE5D8"/>
  <text x="414" y="343" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="500" fill="#7C6E5C">32%</text>

  <text x="0" y="384" font-family="Inter, sans-serif" font-size="12" fill="#7C6E5C">Search-centric platforms lead. Snippet-style and training-dependent platforms trail.</text>
</svg>
