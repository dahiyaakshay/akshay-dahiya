<svg viewBox="0 0 400 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="250" fill="#ECE5D8"/>
  <g stroke="#A89A87" stroke-width="0.6" opacity="0.4">
    <line x1="0" y1="62.5" x2="400" y2="62.5"/>
    <line x1="0" y1="125" x2="400" y2="125"/>
    <line x1="0" y1="187.5" x2="400" y2="187.5"/>
    <line x1="100" y1="0" x2="100" y2="250"/>
    <line x1="200" y1="0" x2="200" y2="250"/>
    <line x1="300" y1="0" x2="300" y2="250"/>
  </g>

  <!-- timeline with publish point and citation point -->
  <line x1="60" y1="125" x2="340" y2="125" stroke="#1E1C19" stroke-width="1.3"/>
  <circle cx="90" cy="125" r="7" fill="#1E1C19"/>
  <text x="90" y="150" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#7C6E5C">PUBLISH</text>

  <line x1="90" y1="125" x2="230" y2="125" stroke="#7C6E5C" stroke-width="1.1" stroke-dasharray="3 4"/>
  <text x="160" y="105" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#7C6E5C">14 DAYS</text>

  <circle cx="230" cy="125" r="9" stroke="#1E1C19" stroke-width="1.6" fill="#F4EFE6"/>
  <text x="230" y="150" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#1E1C19">CITED</text>
</svg>
