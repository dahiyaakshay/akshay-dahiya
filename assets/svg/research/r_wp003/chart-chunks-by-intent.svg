<svg viewBox="0 0 660 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="660" height="340" fill="#F4EFE6"/>
  <text x="0" y="26" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="500" fill="#1E1C19">AVERAGE CHUNKS RETRIEVED BY QUERY INTENT</text>

  <line x1="90" y1="270" x2="620" y2="270" stroke="#1E1C19" stroke-width="1.2"/>
  <g stroke="#A89A87" stroke-width="0.5" opacity="0.35">
    <line x1="90" y1="220" x2="620" y2="220"/>
    <line x1="90" y1="170" x2="620" y2="170"/>
    <line x1="90" y1="120" x2="620" y2="120"/>
    <line x1="90" y1="70" x2="620" y2="70"/>
  </g>
  <g font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#7C6E5C" text-anchor="end">
    <text x="82" y="274">0</text>
    <text x="82" y="224">1.5</text>
    <text x="82" y="174">3.0</text>
    <text x="82" y="124">4.5</text>
    <text x="82" y="74">6.0</text>
  </g>

  <!-- Commercial 4.2, Analytical 5.6, Troubleshooting 3.8, Opinion 2.9. scale 6.0 -> 200px -->
  <g font-family="'IBM Plex Mono', monospace" font-size="12.5" font-weight="500" fill="#1E1C19" text-anchor="middle">
    <rect x="130" y="130" width="90" height="140" stroke="#7C6E5C" stroke-width="1.2" fill="#ECE5D8"/>
    <text x="175" y="120">4.2</text>

    <rect x="270" y="83" width="90" height="187" fill="#1E1C19"/>
    <text x="315" y="73">5.6</text>

    <rect x="410" y="143" width="90" height="127" stroke="#7C6E5C" stroke-width="1.2" fill="#ECE5D8"/>
    <text x="455" y="133">3.8</text>

    <rect x="550" y="173" width="70" height="97" stroke="#7C6E5C" stroke-width="1.2" fill="#ECE5D8"/>
    <text x="585" y="163">2.9</text>
  </g>

  <g font-family="Inter, sans-serif" font-size="11.5" fill="#3C3730" text-anchor="middle">
    <text x="175" y="292">Commercial</text>
    <text x="315" y="292">Analytical</text>
    <text x="455" y="292">Troubleshooting</text>
    <text x="585" y="292">Opinion</text>
  </g>

  <text x="0" y="322" font-family="Inter, sans-serif" font-size="12" fill="#7C6E5C">Analytical queries pull the widest coverage. Opinion queries pull the narrowest.</text>
</svg>
