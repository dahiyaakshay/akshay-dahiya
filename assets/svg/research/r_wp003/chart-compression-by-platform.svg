  <text x="424" y="156" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="500" fill="#1E1C19">28%</text>

  <text x="170" y="193" text-anchor="end" font-family="Inter, sans-serif" font-size="12.5" fill="#3C3730">Microsoft Copilot</text>
  <rect x="180" y="182" width="211" height="18" stroke="#7C6E5C" stroke-width="1.2" fill="#ECE5D8"/>
