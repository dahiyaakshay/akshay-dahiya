  <text x="568" y="76" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="500" fill="#1E1C19">45%</text>

  <text x="170" y="113" text-anchor="end" font-family="Inter, sans-serif" font-size="12.5" fill="#3C3730">Claude</text>
