  <text x="509" y="116" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="500" fill="#1E1C19">38%</text>

  <text x="170" y="153" text-anchor="end" font-family="Inter, sans-serif" font-size="12.5" fill="#3C3730">Qwen</text>
