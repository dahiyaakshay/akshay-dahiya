  <text x="0" y="46" font-family="Inter, sans-serif" font-size="12" fill="#7C6E5C">Percent of an average page actually retrieved</text>

  <line x1="180" y1="58" x2="180" y2="310" stroke="#1E1C19" stroke-width="1.2"/>

