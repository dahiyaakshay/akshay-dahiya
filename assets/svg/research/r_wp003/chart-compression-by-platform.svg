  <text x="170" y="233" text-anchor="end" font-family="Inter, sans-serif" font-size="12.5" fill="#3C3730">ChatGPT</text>
  <rect x="180" y="222" width="186" height="18" stroke="#7C6E5C" stroke-width="1.2" fill="#ECE5D8"/>
  <text x="374" y="236" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="500" fill="#1E1C19">22%</text>

