<svg viewBox="0 0 660 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="660" height="400" fill="#F4EFE6"/>
  <text x="0" y="26" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="500" fill="#1E1C19">PLATFORM SIGNAL EMPHASIS (ILLUSTRATIVE)</text>
  <text x="0" y="46" font-family="Inter, sans-serif" font-size="11.5" fill="#7C6E5C">Relative emphasis only, not a precise or externally benchmarked score</text>

  <!-- column headers -->
  <g font-family="Inter, sans-serif" font-size="9.5" fill="#3C3730" text-anchor="middle">
    <text x="230" y="70">Entity</text>
    <text x="230" y="81">Validation</text>
    <text x="310" y="70">Review</text>
    <text x="310" y="81">Weighting</text>
    <text x="390" y="70">Directory</text>
    <text x="390" y="81">Reliance</text>
    <text x="470" y="70">Content</text>
    <text x="470" y="81">Depth</text>
    <text x="550" y="70">Editorial</text>
    <text x="550" y="81">Enrichment</text>
    <text x="620" y="70">Filtering</text>
    <text x="620" y="81">Selectivity</text>
  </g>

  <!-- rows: ChatGPT, Gemini, Claude, Perplexity, Copilot, Qwen -->
  <!-- cell grid: x centers 230,310,390,470,550,620 ; row y centers 108,150,192,234,276,318 -->
  <g font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="#1E1C19">
    <text x="0" y="112">ChatGPT</text>
    <text x="0" y="154">Gemini</text>
    <text x="0" y="196">Claude</text>
    <text x="0" y="238">Perplexity</text>
    <text x="0" y="280">Copilot</text>
    <text x="0" y="322">Qwen</text>
  </g>

  <!-- default light cells -->
  <g>
    <!-- ChatGPT row: high Entity Validation -->
    <circle cx="230" cy="108" r="12" fill="#1E1C19"/>
    <circle cx="310" cy="108" r="8" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
    <circle cx="390" cy="108" r="8" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
    <circle cx="470" cy="108" r="8" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
    <circle cx="550" cy="108" r="8" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
    <circle cx="620" cy="108" r="8" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>

    <!-- Gemini row: high Directory Reliance and Content Depth -->
    <circle cx="230" cy="150" r="8" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
    <circle cx="310" cy="150" r="8" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
    <circle cx="390" cy="150" r="12" fill="#1E1C19"/>
    <circle cx="470" cy="150" r="12" fill="#1E1C19"/>
    <circle cx="550" cy="150" r="8" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
    <circle cx="620" cy="150" r="8" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>

    <!-- Claude row: high Review Weighting and Filtering Selectivity -->
    <circle cx="230" cy="192" r="8" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
    <circle cx="310" cy="192" r="12" fill="#1E1C19"/>
    <circle cx="390" cy="192" r="8" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
    <circle cx="470" cy="192" r="8" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
    <circle cx="550" cy="192" r="8" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
    <circle cx="620" cy="192" r="12" fill="#1E1C19"/>

    <!-- Perplexity row: high Review Weighting -->
    <circle cx="230" cy="234" r="8" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
    <circle cx="310" cy="234" r="12" fill="#1E1C19"/>
    <circle cx="390" cy="234" r="8" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
    <circle cx="470" cy="234" r="8" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
    <circle cx="550" cy="234" r="8" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
    <circle cx="620" cy="234" r="8" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>

    <!-- Copilot row: high Editorial Enrichment -->
    <circle cx="230" cy="276" r="8" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
    <circle cx="310" cy="276" r="8" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
    <circle cx="390" cy="276" r="8" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
    <circle cx="470" cy="276" r="8" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
    <circle cx="550" cy="276" r="12" fill="#1E1C19"/>
    <circle cx="620" cy="276" r="8" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>

    <!-- Qwen row: high Directory Reliance -->
    <circle cx="230" cy="318" r="8" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
    <circle cx="310" cy="318" r="8" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
    <circle cx="390" cy="318" r="12" fill="#1E1C19"/>
    <circle cx="470" cy="318" r="8" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
    <circle cx="550" cy="318" r="8" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
    <circle cx="620" cy="318" r="8" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
  </g>

  <line x1="0" y1="350" x2="660" y2="350" stroke="#A89A87" stroke-width="0.6" opacity="0.5"/>
  <circle cx="8" cy="368" r="8" fill="#1E1C19"/>
  <text x="24" y="372" font-family="Inter, sans-serif" font-size="11" fill="#3C3730">Dominant signal for that platform</text>
  <circle cx="270" cy="368" r="6" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
  <text x="284" y="372" font-family="Inter, sans-serif" font-size="11" fill="#3C3730">Secondary or lower emphasis</text>
</svg>
