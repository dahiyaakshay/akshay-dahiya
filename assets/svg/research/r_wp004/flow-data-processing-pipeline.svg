<svg viewBox="0 0 660 470" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="660" height="470" fill="#F4EFE6"/>
<line x1="34" y1="40" x2="34" y2="410" stroke="#A89A87" stroke-width="1.2" stroke-dasharray="3 5"/>
<circle cx="34" cy="40" r="13" fill="#1E1C19"/>
<text x="60" y="38" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">01 / PROMPT EXECUTION</text>
<text x="60" y="58" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">10,000 unique prompts x 6 models via API. Output: 60,000 prompts</text>
<circle cx="34" cy="114" r="13" stroke="#1E1C19" stroke-width="1.5" fill="#F4EFE6"/>
<text x="60" y="112" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">02 / RECOMMENDATION EXTRACTION</text>
<text x="60" y="132" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">Structured-output prompting and named-entity extraction. Output: 510,422 raw mentions</text>
<circle cx="34" cy="188" r="13" stroke="#1E1C19" stroke-width="1.5" fill="#F4EFE6"/>
<text x="60" y="186" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">03 / ENTITY NORMALISATION</text>
<text x="60" y="206" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">Casing, punctuation, suffixes standardised. 37,586 removed for no citation URL. Output: 472,836 mentions</text>
<circle cx="34" cy="262" r="13" stroke="#1E1C19" stroke-width="1.5" fill="#F4EFE6"/>
<text x="60" y="260" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">04 / BUSINESS DEDUPLICATION</text>
<text x="60" y="280" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">Exact citation URL matching across all 472,836 mentions. Output: 21,481 unique businesses</text>
<circle cx="34" cy="336" r="13" stroke="#1E1C19" stroke-width="1.5" fill="#F4EFE6"/>
<text x="60" y="334" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">05 / CCS CALCULATION</text>
<text x="60" y="354" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">Count of distinct models recommending each business, producing a score from 1 to 6</text>
<circle cx="34" cy="410" r="13" fill="#1E1C19"/>
<text x="60" y="408" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">06 / OVERLAP CALCULATION</text>
<text x="60" y="428" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">Jaccard similarity on deduplicated sets per category, averaged across all ten</text>
</svg>