<text x="60" y="112" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">02 / LAYER 2: SEMANTIC RELEVANCE</text>
<text x="60" y="132" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">Can the business satisfy the user's specific request? Service pages, content depth, intent alignment</text>
<circle cx="34" cy="188" r="13" fill="#1E1C19"/>
<text x="60" y="186" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">03 / LAYER 3: CITATION CONSENSUS</text>
<text x="60" y="206" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">Do multiple independent AI systems agree this business deserves recommendation? Cross-platform visibility</text>
</svg>