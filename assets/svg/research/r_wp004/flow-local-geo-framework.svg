<text x="60" y="38" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">01 / LAYER 1: ENTITY AUTHORITY</text>
<text x="60" y="58" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">Can the AI confidently identify and validate the business? Reviews, directory presence, profile completeness</text>
