<svg viewBox="0 0 660 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="660" height="380" fill="#F4EFE6"/>
  <text x="0" y="26" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="500" fill="#1E1C19">CCS DISTRIBUTION: % OF BUSINESSES AT EACH LEVEL</text>

  <line x1="90" y1="300" x2="620" y2="300" stroke="#1E1C19" stroke-width="1.2"/>
  <g stroke="#A89A87" stroke-width="0.5" opacity="0.35">
    <line x1="90" y1="240" x2="620" y2="240"/>
    <line x1="90" y1="180" x2="620" y2="180"/>
    <line x1="90" y1="120" x2="620" y2="120"/>
    <line x1="90" y1="60" x2="620" y2="60"/>
  </g>
  <g font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#7C6E5C" text-anchor="end">
    <text x="82" y="304">0</text>
    <text x="82" y="244">15%</text>
    <text x="82" y="184">30%</text>
    <text x="82" y="124">45%</text>
    <text x="82" y="64">60%</text>
  </g>

  <!-- CCS1 58, CCS2 18, CCS3 11, CCS4 7, CCS5 4, CCS6 2. scale 60% -> 240px -->
  <g font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="500" fill="#1E1C19" text-anchor="middle">
    <rect x="100" y="68" width="70" height="232" fill="#1E1C19"/>
    <text x="135" y="59">58%</text>

    <rect x="190" y="228" width="70" height="72" stroke="#7C6E5C" stroke-width="1.2" fill="#ECE5D8"/>
    <text x="225" y="219">18%</text>

    <rect x="280" y="256" width="70" height="44" stroke="#7C6E5C" stroke-width="1.2" fill="#ECE5D8"/>
    <text x="315" y="247">11%</text>

    <rect x="370" y="272" width="70" height="28" stroke="#7C6E5C" stroke-width="1.2" fill="#ECE5D8"/>
    <text x="405" y="263">7%</text>

    <rect x="460" y="284" width="70" height="16" stroke="#7C6E5C" stroke-width="1.2" fill="#ECE5D8"/>
    <text x="495" y="275">4%</text>

    <rect x="550" y="292" width="70" height="8" stroke="#7C6E5C" stroke-width="1.2" fill="#ECE5D8"/>
    <text x="585" y="283">2%</text>
  </g>

  <g font-family="Inter, sans-serif" font-size="10.5" fill="#3C3730" text-anchor="middle">
    <text x="135" y="320">CCS 1</text>
    <text x="135" y="334">Platform-Specific</text>
    <text x="225" y="320">CCS 2</text>
    <text x="225" y="334">Emerging</text>
    <text x="315" y="320">CCS 3</text>
    <text x="315" y="334">Moderate</text>
    <text x="405" y="320">CCS 4</text>
    <text x="405" y="334">Strong</text>
    <text x="495" y="320">CCS 5</text>
    <text x="495" y="334">Very Strong</text>
    <text x="585" y="320">CCS 6</text>
    <text x="585" y="334">Universal</text>
  </g>

  <text x="0" y="362" font-family="Inter, sans-serif" font-size="12" fill="#7C6E5C">Heavily right-skewed. Most recommended businesses are visible on exactly one platform.</text>
</svg>
