<svg viewBox="0 0 660 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="660" height="380" fill="#F4EFE6"/>
  <text x="0" y="26" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="500" fill="#1E1C19">ESTIMATED MEDIAN RETRIEVAL LATENCY BY PLATFORM</text>
  <text x="0" y="46" font-family="Inter, sans-serif" font-size="12" fill="#7C6E5C">Mid-authority sites (1,000 to 10,000 referring domains)</text>

  <!-- baseline -->
  <line x1="185" y1="60" x2="185" y2="350" stroke="#1E1C19" stroke-width="1.2"/>

  <!-- 7 rows, 40px pitch -->
  <!-- Perplexity ~3.5d -->
  <text x="175" y="75" text-anchor="end" font-family="Inter, sans-serif" font-size="12.5" fill="#3C3730">Perplexity</text>
  <rect x="185" y="64" width="63" height="18" fill="#1E1C19"/>
  <text x="256" y="78" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="500" fill="#1E1C19">~3.5 d</text>

  <!-- Google AI Overviews ~5d -->
  <text x="175" y="115" text-anchor="end" font-family="Inter, sans-serif" font-size="12.5" fill="#3C3730">Google AI Overviews</text>
  <rect x="185" y="104" width="90" height="18" fill="#1E1C19"/>
  <text x="283" y="118" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="500" fill="#1E1C19">~5 d</text>

  <!-- Gemini ~6.5d -->
  <text x="175" y="155" text-anchor="end" font-family="Inter, sans-serif" font-size="12.5" fill="#3C3730">Gemini</text>
  <rect x="185" y="144" width="117" height="18" stroke="#7C6E5C" stroke-width="1.2" fill="#ECE5D8"/>
  <text x="310" y="158" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="500" fill="#1E1C19">~6.5 d</text>

  <!-- Microsoft Copilot ~8d -->
  <text x="175" y="195" text-anchor="end" font-family="Inter, sans-serif" font-size="12.5" fill="#3C3730">Microsoft Copilot</text>
  <rect x="185" y="184" width="144" height="18" stroke="#7C6E5C" stroke-width="1.2" fill="#ECE5D8"/>
  <text x="337" y="198" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="500" fill="#1E1C19">~8 d</text>

  <!-- ChatGPT ~14d -->
  <text x="175" y="235" text-anchor="end" font-family="Inter, sans-serif" font-size="12.5" fill="#3C3730">ChatGPT</text>
  <rect x="185" y="224" width="252" height="18" stroke="#7C6E5C" stroke-width="1.2" fill="#ECE5D8"/>
  <text x="445" y="238" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="500" fill="#1E1C19">~14 d</text>

  <!-- Claude Weeks+ -->
  <text x="175" y="275" text-anchor="end" font-family="Inter, sans-serif" font-size="12.5" fill="#3C3730">Claude</text>
  <rect x="185" y="264" width="380" height="18" stroke="#A89A87" stroke-width="1.1" stroke-dasharray="2 3" fill="#ECE5D8"/>
  <text x="573" y="278" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="500" fill="#7C6E5C">Weeks+</text>

  <!-- Qwen Weeks+ -->
  <text x="175" y="315" text-anchor="end" font-family="Inter, sans-serif" font-size="12.5" fill="#3C3730">Qwen</text>
  <rect x="185" y="304" width="380" height="18" stroke="#A89A87" stroke-width="1.1" stroke-dasharray="2 3" fill="#ECE5D8"/>
  <text x="573" y="318" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="500" fill="#7C6E5C">Weeks+</text>

  <text x="0" y="360" font-family="Inter, sans-serif" font-size="12" fill="#7C6E5C">Real-time retrieval engines cluster under 10 days. Training-dependent engines don't.</text>
</svg>
