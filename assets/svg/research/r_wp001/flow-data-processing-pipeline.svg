<svg viewBox="0 0 660 618" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="660" height="618" fill="#F4EFE6"/>
<line x1="34" y1="40" x2="34" y2="558" stroke="#A89A87" stroke-width="1.2" stroke-dasharray="3 5"/>
<circle cx="34" cy="40" r="13" fill="#1E1C19"/>
<text x="60" y="38" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">01 / PROMPT SUBMISSION</text>
<text x="60" y="58" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">Sent to AI platform via interface or API, response captured in full</text>
<circle cx="34" cy="114" r="13" stroke="#1E1C19" stroke-width="1.5" fill="#F4EFE6"/>
<text x="60" y="112" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">02 / RESPONSE COLLECTION</text>
<text x="60" y="132" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">Full text and citation metadata recorded with timestamp</text>
<circle cx="34" cy="188" r="13" stroke="#1E1C19" stroke-width="1.5" fill="#F4EFE6"/>
<text x="60" y="186" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">03 / CITATION EXTRACTION</text>
<text x="60" y="206" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">URLs and source references parsed; platform-specific rules applied</text>
<circle cx="34" cy="262" r="13" stroke="#1E1C19" stroke-width="1.5" fill="#F4EFE6"/>
<text x="60" y="260" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">04 / URL NORMALIZATION</text>
<text x="60" y="280" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">Trailing slashes removed, params stripped, http/https and www collapsed</text>
<circle cx="34" cy="336" r="13" stroke="#1E1C19" stroke-width="1.5" fill="#F4EFE6"/>
<text x="60" y="334" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">05 / DUPLICATE REMOVAL</text>
<text x="60" y="354" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">Within-response duplicates collapsed to one citation per URL</text>
<circle cx="34" cy="410" r="13" stroke="#1E1C19" stroke-width="1.5" fill="#F4EFE6"/>
<text x="60" y="408" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">06 / LATENCY CALCULATION</text>
<text x="60" y="428" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">Days from publish or update date to first citation computed</text>
<circle cx="34" cy="484" r="13" stroke="#1E1C19" stroke-width="1.5" fill="#F4EFE6"/>
<text x="60" y="482" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">07 / CROSS-ENGINE COMPARISON</text>
<text x="60" y="502" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">Citation sets compared across platforms for overlap, latency, freshness</text>
<circle cx="34" cy="558" r="13" fill="#1E1C19"/>
<text x="60" y="556" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">08 / METRIC GENERATION</text>
<text x="60" y="576" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">Final metrics: replacement rate, median latency, content age</text>
</svg>