<svg viewBox="0 0 660 396" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="660" height="396" fill="#F4EFE6"/>
<line x1="34" y1="40" x2="34" y2="336" stroke="#A89A87" stroke-width="1.2" stroke-dasharray="3 5"/>
<circle cx="34" cy="40" r="13" fill="#1E1C19"/>
<text x="60" y="38" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">01 / PUBLISH ANSWER-FIRST CONTENT</text>
<text x="60" y="58" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">Lead every page with a direct answer in the first 120 words</text>
<circle cx="34" cy="114" r="13" stroke="#1E1C19" stroke-width="1.5" fill="#F4EFE6"/>
<text x="60" y="112" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">02 / BUILD INTERNAL LINKING DENSITY</text>
<text x="60" y="132" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">Ensure each target page receives at least 10 internal links</text>
<circle cx="34" cy="188" r="13" stroke="#1E1C19" stroke-width="1.5" fill="#F4EFE6"/>
<text x="60" y="186" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">03 / EARN EXTERNAL LINKS</text>
<text x="60" y="206" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">Referring domain count is the primary authority signal</text>
<circle cx="34" cy="262" r="13" stroke="#1E1C19" stroke-width="1.5" fill="#F4EFE6"/>
<text x="60" y="260" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">04 / BUILD DOMAIN AUTHORITY OVER TIME</text>
<text x="60" y="280" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">Authority accumulation is slow. This study measured citation speed, not this</text>
<circle cx="34" cy="336" r="13" fill="#1E1C19"/>
<text x="60" y="334" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">05 / AI CITATION VISIBILITY</text>
<text x="60" y="354" font-family="Inter, sans-serif" font-size="12.5" fill="#7C6E5C">First citations typically appear in Perplexity and Google AI Overviews first</text>
</svg>