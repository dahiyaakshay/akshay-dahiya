<svg viewBox="0 0 700 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g stroke="#A89A87" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="700" y2="100"/>
    <line x1="0" y1="200" x2="700" y2="200"/>
    <line x1="0" y1="300" x2="700" y2="300"/>
    <line x1="175" y1="0" x2="175" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
    <line x1="525" y1="0" x2="525" y2="400"/>
  </g>

  <!-- spokes -->
  <g stroke="#A89A87" stroke-width="0.9" opacity="0.7">
    <line x1="350" y1="200" x2="120" y2="70"/>
    <line x1="350" y1="200" x2="350" y2="45"/>
    <line x1="350" y1="200" x2="580" y2="70"/>
    <line x1="350" y1="200" x2="620" y2="160"/>
