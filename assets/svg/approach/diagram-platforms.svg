  <!-- center node -->
  <circle cx="350" cy="200" r="34" fill="#1E1C19"/>
  <text x="350" y="193" text-anchor="middle" font-family="'Fraunces', serif" font-size="15" fill="#F4EFE6">Your</text>
  <text x="350" y="212" text-anchor="middle" font-family="'Fraunces', serif" font-size="15" fill="#F4EFE6">Brand</text>

