<circle cx="70" cy="107.0" r="14" fill="#B58CFF"/>
<text x="70" y="112.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">1</text>
<text x="100" y="100" font-size="15" font-weight="700" fill="#434C4A">Audit your cross-domain presence</text>
<text x="100" y="120" font-size="12.5" fill="#6B7471">G2, Capterra, GitHub, integration partner pages, security databases</text>
<line x1="350.0" y1="144" x2="350.0" y2="172" stroke="#C9C4D4" stroke-width="2"/>
<polygon points="345.0,172 355.0,172 350.0,178" fill="#C9C4D4"/>
