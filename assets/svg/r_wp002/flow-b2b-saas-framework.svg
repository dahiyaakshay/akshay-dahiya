<circle cx="70" cy="323.0" r="14" fill="#B58CFF"/>
<text x="70" y="328.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">3</text>
<text x="100" y="316" font-size="15" font-weight="700" fill="#434C4A">Write for contextual and complex query intents</text>
<text x="100" y="336" font-size="12.5" fill="#6B7471">These trigger 34 to 82% MHCR. Simple FAQ answers rarely participate.</text>
