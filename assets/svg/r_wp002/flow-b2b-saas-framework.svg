<text x="100" y="424" font-size="15" font-weight="700" fill="#434C4A">Enter the multi-hop citation pool</text>
<text x="100" y="444" font-size="12.5" fill="#6B7471">Source Reuse Ratio of 0.34 means once in, you tend to stay in</text>
<line x1="350.0" y1="468" x2="350.0" y2="496" stroke="#C9C4D4" stroke-width="2"/>
<polygon points="345.0,496 355.0,496 350.0,502" fill="#C9C4D4"/>
<rect x="40" y="502" width="620" height="74" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="70" cy="539.0" r="14" fill="#B58CFF"/>
<text x="70" y="544.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">5</text>
<text x="100" y="532" font-size="15" font-weight="700" fill="#434C4A">Monitor citation presence on Perplexity and Copilot</text>
<text x="100" y="552" font-size="12.5" fill="#6B7471">These platforms are most likely to include you in multi-hop paths</text>
