<circle cx="70" cy="215.0" r="14" fill="#B58CFF"/>
<text x="70" y="220.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">2</text>
<text x="100" y="208" font-size="15" font-weight="700" fill="#434C4A">Structure documentation for atomic extraction</text>
<text x="100" y="228" font-size="12.5" fill="#6B7471">Each doc page answers one question. Section headers are searchable claims.</text>
<line x1="350.0" y1="252" x2="350.0" y2="280" stroke="#C9C4D4" stroke-width="2"/>
