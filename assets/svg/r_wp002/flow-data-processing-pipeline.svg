<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 930" width="780" height="930" font-family="Inter, Arial, sans-serif">
<rect x="0" y="0" width="780" height="930" fill="#FEFEFE"/>
<text x="40" y="38" font-size="18" font-weight="700" fill="#434C4A">Data Processing Pipeline</text>

<rect x="40" y="70" width="700" height="74" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="70" cy="107.0" r="14" fill="#B58CFF"/>
<text x="70" y="112.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">1</text>
<text x="100" y="100" font-size="15" font-weight="700" fill="#434C4A">Prompt Submission</text>
<text x="100" y="120" font-size="12.5" fill="#6B7471">Prompt sent to AI platform via interface or API. Response captured in full.</text>
<line x1="390.0" y1="144" x2="390.0" y2="172" stroke="#C9C4D4" stroke-width="2"/>
<polygon points="385.0,172 395.0,172 390.0,178" fill="#C9C4D4"/>

<rect x="40" y="178" width="700" height="74" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="70" cy="215.0" r="14" fill="#B58CFF"/>
<text x="70" y="220.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">2</text>
<text x="100" y="208" font-size="15" font-weight="700" fill="#434C4A">Citation Extraction</text>
<text x="100" y="228" font-size="12.5" fill="#6B7471">Citation URLs and source domains parsed from each response.</text>
<line x1="390.0" y1="252" x2="390.0" y2="280" stroke="#C9C4D4" stroke-width="2"/>
<polygon points="385.0,280 395.0,280 390.0,286" fill="#C9C4D4"/>

<rect x="40" y="286" width="700" height="74" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="70" cy="323.0" r="14" fill="#B58CFF"/>
<text x="70" y="328.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">3</text>
<text x="100" y="316" font-size="15" font-weight="700" fill="#434C4A">Hop Counting</text>
<text x="100" y="336" font-size="12.5" fill="#6B7471">A hop counted each time retrieval moves to a distinct second source domain.</text>
<line x1="390.0" y1="360" x2="390.0" y2="388" stroke="#C9C4D4" stroke-width="2"/>
<polygon points="385.0,388 395.0,388 390.0,394" fill="#C9C4D4"/>

<rect x="40" y="394" width="700" height="74" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="70" cy="431.0" r="14" fill="#B58CFF"/>
<text x="70" y="436.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">4</text>
<text x="100" y="424" font-size="15" font-weight="700" fill="#434C4A">Fan-Out Estimation</text>
<text x="100" y="444" font-size="12.5" fill="#6B7471">Distinct retrieval sub-queries counted or inferred from citations.</text>
<line x1="390.0" y1="468" x2="390.0" y2="496" stroke="#C9C4D4" stroke-width="2"/>
<polygon points="385.0,496 395.0,496 390.0,502" fill="#C9C4D4"/>

<rect x="40" y="502" width="700" height="74" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="70" cy="539.0" r="14" fill="#B58CFF"/>
<text x="70" y="544.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">5</text>
<text x="100" y="532" font-size="15" font-weight="700" fill="#434C4A">Evidence Chain Tracing</text>
<text x="100" y="552" font-size="12.5" fill="#6B7471">Source-to-claim links traced across citations to build the evidence chain.</text>
<line x1="390.0" y1="576" x2="390.0" y2="604" stroke="#C9C4D4" stroke-width="2"/>
<polygon points="385.0,604 395.0,604 390.0,610" fill="#C9C4D4"/>

<rect x="40" y="610" width="700" height="74" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="70" cy="647.0" r="14" fill="#B58CFF"/>
<text x="70" y="652.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">6</text>
<text x="100" y="640" font-size="15" font-weight="700" fill="#434C4A">Cross-Domain Flagging</text>
<text x="100" y="660" font-size="12.5" fill="#6B7471">Two or more distinct domains in one response flagged as cross-domain.</text>
<line x1="390.0" y1="684" x2="390.0" y2="712" stroke="#C9C4D4" stroke-width="2"/>
<polygon points="385.0,712 395.0,712 390.0,718" fill="#C9C4D4"/>

<rect x="40" y="718" width="700" height="74" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="70" cy="755.0" r="14" fill="#B58CFF"/>
<text x="70" y="760.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">7</text>
<text x="100" y="748" font-size="15" font-weight="700" fill="#434C4A">Source Reuse Detection</text>
<text x="100" y="768" font-size="12.5" fill="#6B7471">Repeat citations of the same URL within a prompt batch identified.</text>
<line x1="390.0" y1="792" x2="390.0" y2="820" stroke="#C9C4D4" stroke-width="2"/>
<polygon points="385.0,820 395.0,820 390.0,826" fill="#C9C4D4"/>

<rect x="40" y="826" width="700" height="74" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="70" cy="863.0" r="14" fill="#B58CFF"/>
<text x="70" y="868.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">8</text>
<text x="100" y="856" font-size="15" font-weight="700" fill="#434C4A">Metric Generation</text>
<text x="100" y="876" font-size="12.5" fill="#6B7471">MHCR, hop depth, fan-out, evidence chain length, and diversity computed.</text>
</svg>
