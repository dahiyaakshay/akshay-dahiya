<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 606" width="680" height="606" font-family="Inter, Arial, sans-serif">
<rect x="0" y="0" width="680" height="606" fill="#FEFEFE"/>
<text x="40" y="38" font-size="18" font-weight="700" fill="#434C4A">New / Low-Authority Site Framework</text>
<rect x="40" y="70" width="600" height="74" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="70" cy="107.0" r="14" fill="#B58CFF"/>
<text x="70" y="112.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">1</text>
<text x="100" y="100" font-size="15" font-weight="700" fill="#434C4A">Publish structured, answer-first content</text>
<text x="100" y="120" font-size="12.5" fill="#6B7471">Lead every page with a direct answer in the first 120 words</text>
<line x1="340.0" y1="144" x2="340.0" y2="172" stroke="#C9C4D4" stroke-width="2"/>
<polygon points="335.0,172 345.0,172 340.0,178" fill="#C9C4D4"/>
<rect x="40" y="178" width="600" height="74" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="70" cy="215.0" r="14" fill="#B58CFF"/>
<text x="70" y="220.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">2</text>
<text x="100" y="208" font-size="15" font-weight="700" fill="#434C4A">Build internal linking density</text>
<text x="100" y="228" font-size="12.5" fill="#6B7471">Ensure each target page receives at least 10 internal links</text>
<line x1="340.0" y1="252" x2="340.0" y2="280" stroke="#C9C4D4" stroke-width="2"/>
<polygon points="335.0,280 345.0,280 340.0,286" fill="#C9C4D4"/>
<rect x="40" y="286" width="600" height="74" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="70" cy="323.0" r="14" fill="#B58CFF"/>
<text x="70" y="328.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">3</text>
<text x="100" y="316" font-size="15" font-weight="700" fill="#434C4A">Earn external links</text>
<text x="100" y="336" font-size="12.5" fill="#6B7471">Referring domain count is the primary authority signal</text>
<line x1="340.0" y1="360" x2="340.0" y2="388" stroke="#C9C4D4" stroke-width="2"/>
<polygon points="335.0,388 345.0,388 340.0,394" fill="#C9C4D4"/>
<rect x="40" y="394" width="600" height="74" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="70" cy="431.0" r="14" fill="#B58CFF"/>
<text x="70" y="436.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">4</text>
<text x="100" y="424" font-size="15" font-weight="700" fill="#434C4A">Build domain authority over time</text>
<text x="100" y="444" font-size="12.5" fill="#6B7471">Authority accumulation is not fast. Realistic timeline: 3 to 12 months.</text>
<line x1="340.0" y1="468" x2="340.0" y2="496" stroke="#C9C4D4" stroke-width="2"/>
<polygon points="335.0,496 345.0,496 340.0,502" fill="#C9C4D4"/>
<rect x="40" y="502" width="600" height="74" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="70" cy="539.0" r="14" fill="#B58CFF"/>
<text x="70" y="544.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">5</text>
<text x="100" y="532" font-size="15" font-weight="700" fill="#434C4A">AI citation visibility</text>
<text x="100" y="552" font-size="12.5" fill="#6B7471">First citations typically appear in Perplexity and Google AI Overviews first</text>
</svg>