<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 506" width="700" height="506" font-family="Inter, Arial, sans-serif">
<rect x="0" y="0" width="700" height="506" fill="#FEFEFE"/>
<text x="30" y="32" font-size="16" font-weight="700" fill="#434C4A">Compression Ratio Diagram: Typical 2,000-word Page</text>
<text x="30" y="56" font-size="13" fill="#6B7471">Perplexity: 12% of page retrieved</text>
<rect x="30" y="90" width="640" height="56" rx="8" fill="#8D5CF2"/>
<text x="46" y="114.0" font-size="13" font-weight="700" fill="#FEFEFE">Introduction</text>
<text x="46" y="132.0" font-size="11" fill="#FEFEFE" opacity="0.85">82% (Retrieved)</text>
<rect x="30" y="156" width="640" height="56" rx="8" fill="#E4EAE9"/>
<text x="46" y="180.0" font-size="13" font-weight="700" fill="#434C4A">First H2</text>
<text x="46" y="198.0" font-size="11" fill="#434C4A" opacity="0.85">Skipped in 35% of cases (Often)</text>
<rect x="30" y="222" width="640" height="56" rx="8" fill="#E4EAE9"/>
<text x="46" y="246.0" font-size="13" font-weight="700" fill="#434C4A">FAQ Block</text>
<text x="46" y="264.0" font-size="11" fill="#434C4A" opacity="0.85">Skipped in 46% of cases (Sometimes)</text>
<rect x="30" y="288" width="640" height="56" rx="8" fill="#E4EAE9"/>
<text x="46" y="312.0" font-size="13" font-weight="700" fill="#434C4A">Table</text>
<text x="46" y="330.0" font-size="11" fill="#434C4A" opacity="0.85">Skipped in 78% of cases (Rarely)</text>
<rect x="30" y="354" width="640" height="56" rx="8" fill="#E4EAE9"/>
<text x="46" y="378.0" font-size="13" font-weight="700" fill="#434C4A">Middle Body</text>
<text x="46" y="396.0" font-size="11" fill="#434C4A" opacity="0.85">Skipped in 81% of cases (Rarely)</text>
<rect x="30" y="420" width="640" height="56" rx="8" fill="#E4EAE9"/>
<text x="46" y="444.0" font-size="13" font-weight="700" fill="#434C4A">Conclusion</text>
<text x="46" y="462.0" font-size="11" fill="#434C4A" opacity="0.85">Skipped in 82% of cases (Rarely)</text>
</svg>
