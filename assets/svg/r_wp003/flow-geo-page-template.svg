<circle cx="70" cy="197.0" r="14" fill="#B58CFF"/>
<text x="70" y="202.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">2</text>
<text x="100" y="196" font-size="15" font-weight="700" fill="#434C4A">First H2: descriptive heading with a self-contained claim</text>
<text x="100" y="216" font-size="12.5" fill="#6B7471">Retrieval probability: 73%. Make the heading a complete statement, not a category label.</text>
