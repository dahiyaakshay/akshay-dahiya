<text x="100" y="388" font-size="15" font-weight="700" fill="#434C4A">Additional H2 sections: one intent each, independently readable</text>
<text x="100" y="408" font-size="12.5" fill="#6B7471">Each section should make sense without reading the others. Retrieval is scattered, not sequential.</text>
<line x1="380.0" y1="420" x2="380.0" y2="448" stroke="#C9C4D4" stroke-width="2"/>
<polygon points="375.0,448 385.0,448 380.0,454" fill="#C9C4D4"/>
<rect x="40" y="454" width="680" height="62" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="70" cy="485.0" r="14" fill="#B58CFF"/>
<text x="70" y="490.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">5</text>
<text x="100" y="484" font-size="15" font-weight="700" fill="#434C4A">Dedicated FAQ section</text>
<text x="100" y="504" font-size="12.5" fill="#6B7471">Retrieval probability: 61%. Every factual claim that answers a common question belongs here.</text>
<line x1="380.0" y1="516" x2="380.0" y2="544" stroke="#C9C4D4" stroke-width="2"/>
<polygon points="375.0,544 385.0,544 380.0,550" fill="#C9C4D4"/>
