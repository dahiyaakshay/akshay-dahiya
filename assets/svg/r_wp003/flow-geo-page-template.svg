<text x="70" y="298.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">3</text>
<text x="100" y="292" font-size="15" font-weight="700" fill="#434C4A">Comparison table (if commercial or SaaS intent)</text>
<text x="100" y="312" font-size="12.5" fill="#6B7471">Retrieval probability: 45% for commercial. Highest accuracy correlation of any content type.</text>
<line x1="380.0" y1="324" x2="380.0" y2="352" stroke="#C9C4D4" stroke-width="2"/>
<polygon points="375.0,352 385.0,352 380.0,358" fill="#C9C4D4"/>
