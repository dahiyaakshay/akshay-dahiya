<circle cx="70" cy="581.0" r="14" fill="#B58CFF"/>
<text x="70" y="586.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">6</text>
<text x="100" y="580" font-size="15" font-weight="700" fill="#434C4A">Conclusion (if present): keep it short</text>
<text x="100" y="600" font-size="12.5" fill="#6B7471">Retrieval probability: 26%. Do not place any critical information only in the conclusion.</text>
