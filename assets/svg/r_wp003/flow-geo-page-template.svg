<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 642" width="760" height="642" font-family="Inter, Arial, sans-serif">
<rect x="0" y="0" width="760" height="642" fill="#FEFEFE"/>
<text x="40" y="38" font-size="18" font-weight="700" fill="#434C4A">GEO-Optimised Page Template</text>
<rect x="40" y="70" width="680" height="62" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="70" cy="101.0" r="14" fill="#B58CFF"/>
<text x="70" y="106.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">1</text>
<text x="100" y="100" font-size="15" font-weight="700" fill="#434C4A">Introduction: primary answer in first 200 words</text>
<text x="100" y="120" font-size="12.5" fill="#6B7471">Retrieval probability: 88%. This is your highest-value real estate.</text>
<line x1="380.0" y1="132" x2="380.0" y2="160" stroke="#C9C4D4" stroke-width="2"/>
<polygon points="375.0,160 385.0,160 380.0,166" fill="#C9C4D4"/>
