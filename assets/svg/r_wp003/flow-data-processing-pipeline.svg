<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 486" width="1100" height="486" font-family="Inter, Arial, sans-serif">
<rect x="0" y="0" width="1100" height="486" fill="#FEFEFE"/>
<text x="40" y="38" font-size="18" font-weight="700" fill="#434C4A">Data Processing Pipeline</text>
<rect x="40" y="70" width="313" height="98" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="68" cy="96" r="13" fill="#B58CFF"/>
<text x="68" y="100" font-size="12" font-weight="700" fill="#FEFEFE" text-anchor="middle">1</text>
<text x="90" y="100" font-size="14" font-weight="700" fill="#434C4A">Query submission</text>
<text x="58" y="124" font-size="11.5" fill="#6B7471">Query issued directly in live LLM</text>
<text x="58" y="142" font-size="11.5" fill="#6B7471">environment. Full response recorded with</text>
<text x="58" y="160" font-size="11.5" fill="#6B7471">timestamp.</text>
<line x1="353" y1="119.0" x2="387" y2="119.0" stroke="#C9C4D4" stroke-width="2"/>
<polygon points="387,114.0 387,124.0 393,119.0" fill="#C9C4D4"/>
<rect x="393" y="70" width="313" height="98" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="421" cy="96" r="13" fill="#B58CFF"/>
<text x="421" y="100" font-size="12" font-weight="700" fill="#FEFEFE" text-anchor="middle">2</text>
<text x="443" y="100" font-size="14" font-weight="700" fill="#434C4A">Page archiving</text>
<text x="411" y="124" font-size="11.5" fill="#6B7471">Source pages cited or referenced in the AI</text>
<text x="411" y="142" font-size="11.5" fill="#6B7471">answer archived before each query set for</text>
<text x="411" y="160" font-size="11.5" fill="#6B7471">consistency across runs.</text>
<line x1="706" y1="119.0" x2="740" y2="119.0" stroke="#C9C4D4" stroke-width="2"/>
<polygon points="740,114.0 740,124.0 746,119.0" fill="#C9C4D4"/>
<rect x="746" y="70" width="313" height="98" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="774" cy="96" r="13" fill="#B58CFF"/>
<text x="774" y="100" font-size="12" font-weight="700" fill="#FEFEFE" text-anchor="middle">3</text>
<text x="796" y="100" font-size="14" font-weight="700" fill="#434C4A">Page segmentation</text>
<text x="764" y="124" font-size="11.5" fill="#6B7471">Archived source pages manually segmented into</text>
<text x="764" y="142" font-size="11.5" fill="#6B7471">sections: intro, H2 blocks, FAQ, tables,</text>
<text x="764" y="160" font-size="11.5" fill="#6B7471">body, conclusion.</text>
<rect x="40" y="214" width="313" height="98" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="68" cy="240" r="13" fill="#B58CFF"/>
<text x="68" y="244" font-size="12" font-weight="700" fill="#FEFEFE" text-anchor="middle">4</text>
<text x="90" y="244" font-size="14" font-weight="700" fill="#434C4A">Section matching</text>
<text x="58" y="268" font-size="11.5" fill="#6B7471">AI-generated answer cross-referenced against</text>
<text x="58" y="286" font-size="11.5" fill="#6B7471">archived source page to identify sections</text>
<text x="58" y="304" font-size="11.5" fill="#6B7471">reflected in the response.</text>
<line x1="353" y1="263.0" x2="387" y2="263.0" stroke="#C9C4D4" stroke-width="2"/>
<polygon points="387,258.0 387,268.0 393,263.0" fill="#C9C4D4"/>
<rect x="393" y="214" width="313" height="98" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="421" cy="240" r="13" fill="#B58CFF"/>
<text x="421" y="244" font-size="12" font-weight="700" fill="#FEFEFE" text-anchor="middle">5</text>
<text x="443" y="244" font-size="14" font-weight="700" fill="#434C4A">Compression Ratio calculation</text>
<text x="411" y="268" font-size="11.5" fill="#6B7471">Estimated surfaced word count divided by</text>
<text x="411" y="286" font-size="11.5" fill="#6B7471">total page word count per page per run.</text>
<line x1="706" y1="263.0" x2="740" y2="263.0" stroke="#C9C4D4" stroke-width="2"/>
<polygon points="740,258.0 740,268.0 746,263.0" fill="#C9C4D4"/>
<rect x="746" y="214" width="313" height="98" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="774" cy="240" r="13" fill="#B58CFF"/>
<text x="774" y="244" font-size="12" font-weight="700" fill="#FEFEFE" text-anchor="middle">6</text>
<text x="796" y="244" font-size="14" font-weight="700" fill="#434C4A">Section classification</text>
<text x="764" y="268" font-size="11.5" fill="#6B7471">Each surfaced content block classified by</text>
<text x="764" y="286" font-size="11.5" fill="#6B7471">section type: intro, H2, FAQ, table, middle</text>
<text x="764" y="304" font-size="11.5" fill="#6B7471">body, conclusion.</text>
<rect x="40" y="358" width="313" height="98" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="68" cy="384" r="13" fill="#B58CFF"/>
<text x="68" y="388" font-size="12" font-weight="700" fill="#FEFEFE" text-anchor="middle">7</text>
<text x="90" y="388" font-size="14" font-weight="700" fill="#434C4A">Pattern classification</text>
<text x="58" y="412" font-size="11.5" fill="#6B7471">Retrieval pattern classified as consecutive</text>
<text x="58" y="430" font-size="11.5" fill="#6B7471">or scattered based on estimated paragraph</text>
<text x="58" y="448" font-size="11.5" fill="#6B7471">gaps.</text>
<line x1="353" y1="407.0" x2="387" y2="407.0" stroke="#C9C4D4" stroke-width="2"/>
<polygon points="387,402.0 387,412.0 393,407.0" fill="#C9C4D4"/>
<rect x="393" y="358" width="313" height="98" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="421" cy="384" r="13" fill="#B58CFF"/>
<text x="421" y="388" font-size="12" font-weight="700" fill="#FEFEFE" text-anchor="middle">8</text>
<text x="443" y="388" font-size="14" font-weight="700" fill="#434C4A">Three-run aggregation</text>
<text x="411" y="412" font-size="11.5" fill="#6B7471">Metrics averaged across three runs per query.</text>
<text x="411" y="430" font-size="11.5" fill="#6B7471">Single-run-only sections classified as</text>
<text x="411" y="448" font-size="11.5" fill="#6B7471">marginal.</text>
</svg>