<svg viewBox="0 0 400 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="250" fill="#ECE5D8"/>
  <g stroke="#A89A87" stroke-width="0.6" opacity="0.4">
    <line x1="0" y1="62.5" x2="400" y2="62.5"/>
    <line x1="0" y1="125" x2="400" y2="125"/>
    <line x1="0" y1="187.5" x2="400" y2="187.5"/>
    <line x1="100" y1="0" x2="100" y2="250"/>
    <line x1="200" y1="0" x2="200" y2="250"/>
    <line x1="300" y1="0" x2="300" y2="250"/>
  </g>

  <!-- left: long, sparse -->
  <g stroke="#A89A87" stroke-width="1.4" opacity="0.7">
    <line x1="35" y1="70" x2="150" y2="70"/>
    <line x1="35" y1="85" x2="140" y2="85"/>
    <line x1="35" y1="100" x2="155" y2="100"/>
    <line x1="35" y1="115" x2="130" y2="115"/>
    <line x1="35" y1="130" x2="150" y2="130"/>
    <line x1="35" y1="145" x2="120" y2="145"/>
    <line x1="35" y1="160" x2="150" y2="160"/>
    <line x1="35" y1="175" x2="135" y2="175"/>
  </g>
  <text x="35" y="200" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#7C6E5C">LONG, SPARSE</text>

  <!-- right: short, dense -->
  <g stroke="#1E1C19" stroke-width="2">
    <line x1="245" y1="90" x2="360" y2="90"/>
    <line x1="245" y1="112" x2="350" y2="112"/>
    <line x1="245" y1="134" x2="360" y2="134"/>
  </g>
  <circle cx="380" cy="90" r="4" fill="#1E1C19"/>
  <circle cx="380" cy="112" r="4" fill="#1E1C19"/>
  <circle cx="380" cy="134" r="4" fill="#1E1C19"/>
  <text x="245" y="160" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#1E1C19">SHORT, DENSE</text>
</svg>
