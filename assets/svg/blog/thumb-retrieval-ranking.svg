<svg viewBox="0 0 400 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="250" fill="#ECE5D8"/>
  <g stroke="#A89A87" stroke-width="0.6" opacity="0.4">
    <line x1="0" y1="62.5" x2="400" y2="62.5"/>
    <line x1="0" y1="125" x2="400" y2="125"/>
    <line x1="0" y1="187.5" x2="400" y2="187.5"/>
    <line x1="100" y1="0" x2="100" y2="250"/>
    <line x1="200" y1="0" x2="200" y2="250"/>
    <line x1="300" y1="0" x2="300" y2="250"/>
  </g>

  <!-- ranked list, left -->
  <rect x="40" y="80" width="70" height="18" stroke="#A89A87" stroke-width="1" fill="#ECE5D8"/>
  <rect x="40" y="104" width="70" height="18" stroke="#A89A87" stroke-width="1" fill="#ECE5D8"/>
  <rect x="40" y="128" width="70" height="18" stroke="#A89A87" stroke-width="1" fill="#ECE5D8"/>
  <rect x="40" y="152" width="70" height="18" stroke="#A89A87" stroke-width="1" fill="#ECE5D8"/>
  <text x="20" y="140" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#7C6E5C">RANK</text>

  <!-- converging lines to a single selected chunk -->
  <line x1="110" y1="89" x2="230" y2="125" stroke="#A89A87" stroke-width="0.8" stroke-dasharray="2 3"/>
  <line x1="110" y1="113" x2="230" y2="125" stroke="#A89A87" stroke-width="0.8" stroke-dasharray="2 3"/>
  <line x1="110" y1="137" x2="230" y2="125" stroke="#1E1C19" stroke-width="1.3"/>
  <line x1="110" y1="161" x2="230" y2="125" stroke="#A89A87" stroke-width="0.8" stroke-dasharray="2 3"/>

  <!-- selected evidence chunk, right -->
  <rect x="230" y="105" width="110" height="40" stroke="#1E1C19" stroke-width="1.6" fill="#1E1C19"/>
  <text x="285" y="122" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#F4EFE6">RETRIEVE</text>
  <text x="285" y="136" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#F4EFE6">evidence chunk</text>
</svg>
