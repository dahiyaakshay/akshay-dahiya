<svg viewBox="0 0 660 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="660" height="700" fill="#F4EFE6"/>

  <!-- connecting spine -->
  <line x1="34" y1="40" x2="34" y2="610" stroke="#A89A87" stroke-width="1.2" stroke-dasharray="3 5"/>

  <!-- 1 User Query -->
  <circle cx="34" cy="40" r="14" fill="#1E1C19"/>
  <text x="64" y="38" font-family="'IBM Plex Mono', monospace" font-size="17" font-weight="500" fill="#1E1C19">USER QUERY</text>

  <!-- 2 Entity Extraction -->
  <circle cx="34" cy="112" r="14" stroke="#1E1C19" stroke-width="1.6" fill="#F4EFE6"/>
  <text x="64" y="108" font-family="'IBM Plex Mono', monospace" font-size="17" font-weight="500" fill="#1E1C19">ENTITY EXTRACTION</text>
  <text x="64" y="130" font-family="Inter, sans-serif" font-size="13" fill="#7C6E5C">Plus query understanding</text>

  <!-- 3 Retrieval, forks into three parallel methods -->
  <circle cx="34" cy="186" r="14" stroke="#1E1C19" stroke-width="1.6" fill="#F4EFE6"/>
  <text x="64" y="182" font-family="'IBM Plex Mono', monospace" font-size="17" font-weight="500" fill="#1E1C19">RETRIEVAL</text>
  <text x="64" y="203" font-family="Inter, sans-serif" font-size="13" fill="#7C6E5C">Three methods run in parallel:</text>

  <g font-family="Inter, sans-serif" font-size="13" fill="#3C3730">
    <rect x="64" y="216" width="176" height="30" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
    <text x="76" y="235">Sparse: BM25 match</text>

    <rect x="250" y="216" width="188" height="30" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
    <text x="262" y="235">Dense: embedding search</text>

    <rect x="448" y="216" width="176" height="30" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
    <text x="460" y="235">Knowledge graph lookup</text>
  </g>

  <!-- 4 Fusion -->
  <circle cx="34" cy="290" r="14" stroke="#1E1C19" stroke-width="1.6" fill="#F4EFE6"/>
  <text x="64" y="286" font-family="'IBM Plex Mono', monospace" font-size="17" font-weight="500" fill="#1E1C19">FUSION / RE-RANKING</text>
  <text x="64" y="308" font-family="Inter, sans-serif" font-size="13" fill="#7C6E5C">Combines all three signals into one ranked list</text>

  <!-- 5 Chunk Selection -->
  <circle cx="34" cy="366" r="14" stroke="#1E1C19" stroke-width="1.6" fill="#F4EFE6"/>
  <text x="64" y="362" font-family="'IBM Plex Mono', monospace" font-size="17" font-weight="500" fill="#1E1C19">CHUNK SELECTION</text>
  <text x="64" y="384" font-family="Inter, sans-serif" font-size="13" fill="#7C6E5C">Paragraph or section-sized spans, not whole pages</text>

  <!-- 6 Grounding -->
  <circle cx="34" cy="442" r="14" stroke="#1E1C19" stroke-width="1.6" fill="#F4EFE6"/>
  <text x="64" y="438" font-family="'IBM Plex Mono', monospace" font-size="17" font-weight="500" fill="#1E1C19">GROUNDING</text>
  <text x="64" y="460" font-family="Inter, sans-serif" font-size="13" fill="#7C6E5C">Retrieved chunks supplied to the model as context</text>

  <!-- 7 Generation -->
  <circle cx="34" cy="518" r="14" stroke="#1E1C19" stroke-width="1.6" fill="#F4EFE6"/>
  <text x="64" y="514" font-family="'IBM Plex Mono', monospace" font-size="17" font-weight="500" fill="#1E1C19">GENERATION</text>
  <text x="64" y="536" font-family="Inter, sans-serif" font-size="13" fill="#7C6E5C">Response conditioned on query and grounded context</text>

  <!-- 8 Citation -->
  <circle cx="34" cy="594" r="14" fill="#1E1C19"/>
  <text x="64" y="590" font-family="'IBM Plex Mono', monospace" font-size="17" font-weight="500" fill="#1E1C19">CITATION ATTRIBUTION</text>
  <text x="64" y="612" font-family="Inter, sans-serif" font-size="13" fill="#7C6E5C">Some systems trace claims back to the source chunk</text>

  <!-- note -->
  <line x1="0" y1="650" x2="660" y2="650" stroke="#A89A87" stroke-width="0.6" opacity="0.5"/>
  <text x="0" y="676" font-family="Inter, sans-serif" font-size="13" fill="#7C6E5C">
    <tspan x="0" dy="0">Entity resolution touches nearly every stage except the raw</tspan>
    <tspan x="0" dy="18">embedding math itself.</tspan>
  </text>
</svg>
