<svg viewBox="0 0 660 780" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="660" height="780" fill="#F4EFE6"/>

  <line x1="34" y1="40" x2="34" y2="702" stroke="#A89A87" stroke-width="1.2" stroke-dasharray="3 5"/>

  <circle cx="34" cy="40" r="13" fill="#1E1C19"/>
  <text x="60" y="38" font-family="'IBM Plex Mono', monospace" font-size="15.5" font-weight="500" fill="#1E1C19">DOCUMENT</text>
  <text x="60" y="58" font-family="Inter, sans-serif" font-size="13" fill="#7C6E5C">The source page, before it's split</text>

  <circle cx="34" cy="112" r="13" stroke="#1E1C19" stroke-width="1.5" fill="#F4EFE6"/>
  <text x="60" y="110" font-family="'IBM Plex Mono', monospace" font-size="15.5" font-weight="500" fill="#1E1C19">CHUNKING</text>
  <text x="60" y="130" font-family="Inter, sans-serif" font-size="13" fill="#7C6E5C">Split into retrieval-sized spans</text>

  <circle cx="34" cy="184" r="13" stroke="#1E1C19" stroke-width="1.5" fill="#F4EFE6"/>
  <text x="60" y="182" font-family="'IBM Plex Mono', monospace" font-size="15.5" font-weight="500" fill="#1E1C19">CHUNK EMBEDDINGS</text>
  <text x="60" y="202" font-family="Inter, sans-serif" font-size="13" fill="#7C6E5C">Each chunk becomes one fixed-length vector</text>

  <circle cx="34" cy="256" r="13" stroke="#1E1C19" stroke-width="1.5" fill="#F4EFE6"/>
  <text x="60" y="254" font-family="'IBM Plex Mono', monospace" font-size="15.5" font-weight="500" fill="#1E1C19">VECTOR DATABASE</text>
  <text x="60" y="274" font-family="Inter, sans-serif" font-size="13" fill="#7C6E5C">Indexes chunk vectors for lookup</text>

  <circle cx="34" cy="328" r="14" fill="#1E1C19"/>
  <text x="60" y="326" font-family="'IBM Plex Mono', monospace" font-size="15.5" font-weight="500" fill="#1E1C19">SEMANTIC SIMILARITY SEARCH</text>
  <text x="60" y="346" font-family="Inter, sans-serif" font-size="13" fill="#7C6E5C">
    <tspan x="60" dy="0">Matched against the query's own embedding,</tspan>
    <tspan x="60" dy="17">generated the same way</tspan>
  </text>

  <circle cx="34" cy="418" r="13" stroke="#1E1C19" stroke-width="1.5" fill="#F4EFE6"/>
  <text x="60" y="416" font-family="'IBM Plex Mono', monospace" font-size="15.5" font-weight="500" fill="#1E1C19">ENTITY EXTRACTION</text>
  <text x="60" y="436" font-family="Inter, sans-serif" font-size="13" fill="#7C6E5C">Disambiguates what the chunk actually names</text>

  <circle cx="34" cy="490" r="13" stroke="#1E1C19" stroke-width="1.5" fill="#F4EFE6"/>
  <text x="60" y="488" font-family="'IBM Plex Mono', monospace" font-size="15.5" font-weight="500" fill="#1E1C19">KNOWLEDGE GRAPH</text>
  <text x="60" y="508" font-family="Inter, sans-serif" font-size="13" fill="#7C6E5C">Cross-references structured facts</text>

  <circle cx="34" cy="562" r="13" stroke="#1E1C19" stroke-width="1.5" fill="#F4EFE6"/>
  <text x="60" y="560" font-family="'IBM Plex Mono', monospace" font-size="15.5" font-weight="500" fill="#1E1C19">GROUNDING</text>
  <text x="60" y="580" font-family="Inter, sans-serif" font-size="13" fill="#7C6E5C">Retrieved chunks become model context</text>

  <circle cx="34" cy="634" r="13" stroke="#1E1C19" stroke-width="1.5" fill="#F4EFE6"/>
  <text x="60" y="632" font-family="'IBM Plex Mono', monospace" font-size="15.5" font-weight="500" fill="#1E1C19">CONTEXT WINDOW</text>
  <text x="60" y="652" font-family="Inter, sans-serif" font-size="13" fill="#7C6E5C">Caps how much retrieved content fits per query</text>

  <circle cx="34" cy="702" r="13" fill="#1E1C19"/>
  <text x="60" y="700" font-family="'IBM Plex Mono', monospace" font-size="15.5" font-weight="500" fill="#1E1C19">GENERATED RESPONSE</text>
  <text x="60" y="720" font-family="Inter, sans-serif" font-size="13" fill="#7C6E5C">The final output</text>

  <line x1="0" y1="742" x2="660" y2="742" stroke="#A89A87" stroke-width="0.6" opacity="0.5"/>
  <text x="0" y="768" font-family="Inter, sans-serif" font-size="13" fill="#7C6E5C">Nothing in this pipeline scores a page for total word count.</text>
</svg>
