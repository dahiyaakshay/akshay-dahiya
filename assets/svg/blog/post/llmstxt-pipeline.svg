<svg viewBox="0 0 660 660" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="660" height="660" fill="#F4EFE6"/>

  <!-- connecting spine -->
  <line x1="34" y1="48" x2="34" y2="566" stroke="#A89A87" stroke-width="1.2" stroke-dasharray="3 5"/>

  <!-- 01 Discovery: confirmed, narrow effect -->
  <circle cx="34" cy="48" r="14" fill="#1E1C19"/>
  <text x="64" y="46" font-family="'IBM Plex Mono', monospace" font-size="18" font-weight="500" fill="#1E1C19">01 DISCOVERY</text>
  <text x="64" y="68" font-family="Inter, sans-serif" font-size="14" fill="#1E1C19">Confirmed effect, narrow: coding agents &amp; RAG tools that opt in</text>

  <!-- 02 Crawling: no effect -->
  <circle cx="34" cy="122" r="14" stroke="#7C6E5C" stroke-width="1.6" fill="#F4EFE6"/>
  <text x="64" y="120" font-family="'IBM Plex Mono', monospace" font-size="18" font-weight="500" fill="#1E1C19">02 CRAWLING</text>
  <text x="64" y="142" font-family="Inter, sans-serif" font-size="14" fill="#7C6E5C">No confirmed effect on major AI crawlers</text>

  <!-- 03 Retrieval: no effect -->
  <circle cx="34" cy="196" r="14" stroke="#7C6E5C" stroke-width="1.6" fill="#F4EFE6"/>
  <text x="64" y="194" font-family="'IBM Plex Mono', monospace" font-size="18" font-weight="500" fill="#1E1C19">03 RETRIEVAL</text>
  <text x="64" y="216" font-family="Inter, sans-serif" font-size="14" fill="#7C6E5C">No confirmed preferential treatment in production</text>

  <!-- 04 Chunking: plausible, unmeasured -->
  <circle cx="34" cy="270" r="14" stroke="#7C6E5C" stroke-width="1.6" stroke-dasharray="2 3" fill="#F4EFE6"/>
  <text x="64" y="268" font-family="'IBM Plex Mono', monospace" font-size="18" font-weight="500" fill="#1E1C19">04 CHUNKING</text>
  <text x="64" y="290" font-family="Inter, sans-serif" font-size="14" fill="#7C6E5C">Plausible but unmeasured, reasoning-based only</text>

  <!-- 05 Embeddings: no effect -->
  <circle cx="34" cy="344" r="14" stroke="#7C6E5C" stroke-width="1.6" fill="#F4EFE6"/>
  <text x="64" y="342" font-family="'IBM Plex Mono', monospace" font-size="18" font-weight="500" fill="#1E1C19">05 EMBEDDINGS</text>
  <text x="64" y="364" font-family="Inter, sans-serif" font-size="14" fill="#7C6E5C">No differentiated treatment found</text>

  <!-- 06 Grounding: no effect -->
  <circle cx="34" cy="418" r="14" stroke="#7C6E5C" stroke-width="1.6" fill="#F4EFE6"/>
  <text x="64" y="416" font-family="'IBM Plex Mono', monospace" font-size="18" font-weight="500" fill="#1E1C19">06 GROUNDING</text>
  <text x="64" y="438" font-family="Inter, sans-serif" font-size="14" fill="#7C6E5C">No confirmed preferential grounding</text>

  <!-- 07 Citation: measured, no effect -->
  <circle cx="34" cy="492" r="14" stroke="#7C6E5C" stroke-width="1.6" fill="#F4EFE6"/>
  <circle cx="34" cy="492" r="9" stroke="#7C6E5C" stroke-width="1.2" fill="none"/>
  <text x="64" y="490" font-family="'IBM Plex Mono', monospace" font-size="18" font-weight="500" fill="#1E1C19">07 CITATION</text>
  <text x="64" y="512" font-family="Inter, sans-serif" font-size="14" fill="#7C6E5C">Measured directly, at scale: no lift found</text>

  <!-- 08 Generation: no effect -->
  <circle cx="34" cy="566" r="14" stroke="#7C6E5C" stroke-width="1.6" fill="#F4EFE6"/>
  <text x="64" y="564" font-family="'IBM Plex Mono', monospace" font-size="18" font-weight="500" fill="#1E1C19">08 GENERATION</text>
  <text x="64" y="586" font-family="Inter, sans-serif" font-size="14" fill="#7C6E5C">No evidence of differentiated treatment</text>

  <!-- legend -->
  <line x1="0" y1="618" x2="660" y2="618" stroke="#A89A87" stroke-width="0.6" opacity="0.5"/>
  <circle cx="16" cy="640" r="8" fill="#1E1C19"/>
  <text x="32" y="644" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#3C3730">Confirmed, narrow</text>
  <circle cx="212" cy="640" r="8" stroke="#7C6E5C" stroke-width="1.4" stroke-dasharray="2 2" fill="#F4EFE6"/>
  <text x="228" y="644" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#3C3730">Plausible, unmeasured</text>
  <circle cx="428" cy="640" r="8" stroke="#7C6E5C" stroke-width="1.4" fill="#F4EFE6"/>
  <text x="444" y="644" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#3C3730">No confirmed effect</text>
</svg>
