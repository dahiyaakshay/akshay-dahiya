<svg viewBox="0 0 660 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="660" height="560" fill="#F4EFE6"/>

  <!-- PANEL 1: Backlinks, citation graph -->
  <text x="0" y="24" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">BACKLINKS: CITATION GRAPH</text>

  <g stroke="#7C6E5C" stroke-width="1.1">
    <line x1="60" y1="60" x2="300" y2="130"/>
    <line x1="180" y1="50" x2="300" y2="130"/>
    <line x1="120" y1="150" x2="300" y2="130"/>
    <line x1="420" y1="55" x2="300" y2="130"/>
    <line x1="480" y1="140" x2="300" y2="130"/>
  </g>
  <g>
    <path d="M290 118 L300 130 L280 128" fill="#7C6E5C"/>
  </g>

  <circle cx="60" cy="60" r="10" stroke="#7C6E5C" stroke-width="1.2" fill="#ECE5D8"/>
  <circle cx="180" cy="50" r="10" stroke="#7C6E5C" stroke-width="1.2" fill="#ECE5D8"/>
  <circle cx="120" cy="150" r="10" stroke="#7C6E5C" stroke-width="1.2" fill="#ECE5D8"/>
  <circle cx="420" cy="55" r="10" stroke="#7C6E5C" stroke-width="1.2" fill="#ECE5D8"/>
  <circle cx="480" cy="140" r="10" stroke="#7C6E5C" stroke-width="1.2" fill="#ECE5D8"/>
  <circle cx="300" cy="130" r="18" fill="#1E1C19"/>
  <text x="300" y="135" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#F4EFE6">PAGE</text>

  <text x="0" y="200" font-family="Inter, sans-serif" font-size="13.5" fill="#7C6E5C">
    <tspan x="0" dy="0">Authority is emergent: a page accumulates rank because</tspan>
    <tspan x="0" dy="19">other, already-trusted pages link to it. The graph says</tspan>
    <tspan x="0" dy="19">nothing about what the page is actually about.</tspan>
  </text>

  <line x1="0" y1="278" x2="660" y2="278" stroke="#A89A87" stroke-width="0.6" opacity="0.5"/>

  <!-- PANEL 2: Structured data, entity declaration -->
  <text x="0" y="312" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">STRUCTURED DATA: ENTITY DECLARATION</text>

  <circle cx="120" cy="380" r="24" fill="#1E1C19"/>
  <text x="120" y="376" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#F4EFE6">ORGANIZ-</text>
  <text x="120" y="388" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#F4EFE6">ATION</text>

  <g stroke="#7C6E5C" stroke-width="1.1">
    <line x1="144" y1="368" x2="260" y2="340"/>
    <line x1="144" y1="380" x2="260" y2="380"/>
    <line x1="144" y1="392" x2="260" y2="420"/>
  </g>

  <rect x="260" y="325" width="150" height="30" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
  <text x="272" y="345" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="#1E1C19">name: "Acme Inc."</text>

  <rect x="260" y="365" width="150" height="30" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
  <text x="272" y="385" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="#1E1C19">founder: Person</text>

  <rect x="260" y="405" width="180" height="30" stroke="#7C6E5C" stroke-width="1.1" fill="#ECE5D8"/>
  <text x="272" y="425" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="#1E1C19">sameAs: wikidata.org/…</text>

  <text x="0" y="480" font-family="Inter, sans-serif" font-size="13.5" fill="#7C6E5C">
    <tspan x="0" dy="0">Meaning is declared: the entity states its own name, type</tspan>
    <tspan x="0" dy="19">and relationships directly. No inference from citation or</tspan>
    <tspan x="0" dy="19">context is required to know what the page describes.</tspan>
  </text>
</svg>
