<svg viewBox="0 0 660 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="660" height="420" fill="#F4EFE6"/>

  <!-- PANEL 1: Traditional search -->
  <text x="0" y="24" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">TRADITIONAL SEARCH: CLICK REQUIRED</text>

  <line x1="70" y1="80" x2="610" y2="80" stroke="#1E1C19" stroke-width="1.3"/>

  <circle cx="70" cy="80" r="13" fill="#1E1C19"/>
  <text x="70" y="112" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="#1E1C19">QUERY</text>

  <circle cx="250" cy="80" r="13" stroke="#1E1C19" stroke-width="1.4" fill="#F4EFE6"/>
  <text x="250" y="112" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="#1E1C19">RESULTS LIST</text>

  <circle cx="430" cy="80" r="13" stroke="#1E1C19" stroke-width="1.4" fill="#F4EFE6"/>
  <text x="430" y="112" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="#1E1C19">CLICK</text>

  <circle cx="610" cy="80" r="13" fill="#1E1C19"/>
  <text x="610" y="112" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="#1E1C19">CONVERSION</text>

  <text x="0" y="150" font-family="Inter, sans-serif" font-size="13" fill="#7C6E5C">Every stage is directly observable in standard web analytics.</text>

  <line x1="0" y1="190" x2="660" y2="190" stroke="#A89A87" stroke-width="0.6" opacity="0.5"/>

  <!-- PANEL 2: AI search -->
  <text x="0" y="224" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1E1C19">AI SEARCH: CITATION, CLICK OPTIONAL</text>

  <line x1="70" y1="280" x2="250" y2="280" stroke="#1E1C19" stroke-width="1.3"/>
  <line x1="270" y1="280" x2="410" y2="280" stroke="#1E1C19" stroke-width="1.3"/>
  <line x1="450" y1="280" x2="590" y2="280" stroke="#A89A87" stroke-width="1.1" stroke-dasharray="3 4"/>

  <circle cx="70" cy="280" r="13" fill="#1E1C19"/>
  <text x="70" y="312" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="#1E1C19">QUERY</text>

  <circle cx="250" cy="280" r="13" stroke="#1E1C19" stroke-width="1.4" fill="#F4EFE6"/>
  <text x="250" y="312" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="#1E1C19">AI ANSWER</text>

  <circle cx="430" cy="280" r="15" fill="#1E1C19"/>
  <text x="430" y="316" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="#1E1C19">CITATION</text>

  <circle cx="610" cy="280" r="13" stroke="#7C6E5C" stroke-width="1.2" stroke-dasharray="2 2" fill="#ECE5D8"/>
  <text x="610" y="312" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="#7C6E5C">CONVERSION</text>
  <text x="610" y="326" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#7C6E5C">(rare)</text>

  <text x="0" y="365" font-family="Inter, sans-serif" font-size="13" fill="#7C6E5C">
    <tspan x="0" dy="0">Citation is observable whether or not a click happens. Roughly two-thirds</tspan>
    <tspan x="0" dy="19">of searches end at that point, per SparkToro's 2026 clickstream data.</tspan>
  </text>
</svg>
