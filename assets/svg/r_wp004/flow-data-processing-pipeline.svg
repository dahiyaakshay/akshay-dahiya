<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 762" width="780" height="762" font-family="Inter, Arial, sans-serif">
<rect x="0" y="0" width="780" height="762" fill="#FEFEFE"/>
<text x="40" y="38" font-size="18" font-weight="700" fill="#434C4A">Data Processing Pipeline: From 60,000 Prompts to 21,481 Businesses</text>

<rect x="40" y="70" width="700" height="74" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="70" cy="107.0" r="14" fill="#B58CFF"/>
<text x="70" y="112.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">1</text>
<text x="100" y="100" font-size="15" font-weight="700" fill="#434C4A">Prompt Execution</text>
<text x="100" y="120" font-size="12.5" fill="#6B7471">10,000 unique prompts x 6 models via API, no conversation history. Output: 60,000 prompts.</text>
<line x1="390.0" y1="144" x2="390.0" y2="172" stroke="#C9C4D4" stroke-width="2"/>
<polygon points="385.0,172 395.0,172 390.0,178" fill="#C9C4D4"/>

<rect x="40" y="178" width="700" height="90" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="70" cy="223.0" r="14" fill="#B58CFF"/>
<text x="70" y="228.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">2</text>
<text x="100" y="206" font-size="15" font-weight="700" fill="#434C4A">Recommendation Extraction</text>
<text x="100" y="225" font-size="12.5" fill="#6B7471">Structured-output prompting and named-entity extraction over free-text responses.</text>
<text x="100" y="242" font-size="12.5" fill="#6B7471">Output: 510,422 raw mentions.</text>
<line x1="390.0" y1="268" x2="390.0" y2="296" stroke="#C9C4D4" stroke-width="2"/>
<polygon points="385.0,296 395.0,296 390.0,302" fill="#C9C4D4"/>

<rect x="40" y="302" width="700" height="90" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="70" cy="347.0" r="14" fill="#B58CFF"/>
<text x="70" y="352.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">3</text>
<text x="100" y="330" font-size="15" font-weight="700" fill="#434C4A">Entity Normalisation</text>
<text x="100" y="349" font-size="12.5" fill="#6B7471">Business name casing, punctuation, and suffixes standardised; locations parsed.</text>
<text x="100" y="366" font-size="12.5" fill="#6B7471">Mentions with no citation URL removed (37,586). Output: 472,836 normalised mentions.</text>
<line x1="390.0" y1="392" x2="390.0" y2="420" stroke="#C9C4D4" stroke-width="2"/>
<polygon points="385.0,420 395.0,420 390.0,426" fill="#C9C4D4"/>

<rect x="40" y="426" width="700" height="90" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="70" cy="471.0" r="14" fill="#B58CFF"/>
<text x="70" y="476.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">4</text>
<text x="100" y="454" font-size="15" font-weight="700" fill="#434C4A">Business Deduplication</text>
<text x="100" y="473" font-size="12.5" fill="#6B7471">Exact citation URL matching (domain + path) across all 472,836 mentions.</text>
<text x="100" y="490" font-size="12.5" fill="#6B7471">Output: 21,481 unique businesses.</text>
<line x1="390.0" y1="516" x2="390.0" y2="544" stroke="#C9C4D4" stroke-width="2"/>
<polygon points="385.0,544 395.0,544 390.0,550" fill="#C9C4D4"/>

<rect x="40" y="550" width="700" height="74" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="70" cy="587.0" r="14" fill="#B58CFF"/>
<text x="70" y="592.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">5</text>
<text x="100" y="580" font-size="15" font-weight="700" fill="#434C4A">CCS Calculation</text>
<text x="100" y="600" font-size="12.5" fill="#6B7471">Count of distinct models recommending each business at least once, producing a score from 1 to 6.</text>
<line x1="390.0" y1="624" x2="390.0" y2="652" stroke="#C9C4D4" stroke-width="2"/>
<polygon points="385.0,652 395.0,652 390.0,658" fill="#C9C4D4"/>

<rect x="40" y="658" width="700" height="74" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="70" cy="695.0" r="14" fill="#B58CFF"/>
<text x="70" y="700.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">6</text>
<text x="100" y="688" font-size="15" font-weight="700" fill="#434C4A">Overlap Calculation</text>
<text x="100" y="708" font-size="12.5" fill="#6B7471">Jaccard similarity on deduplicated business sets per category, averaged across all ten categories.</text>
</svg>
