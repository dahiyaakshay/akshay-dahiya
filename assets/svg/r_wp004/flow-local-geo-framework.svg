<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 438" width="760" height="438" font-family="Inter, Arial, sans-serif">
<rect x="0" y="0" width="760" height="438" fill="#FEFEFE"/>
<text x="40" y="38" font-size="18" font-weight="700" fill="#434C4A">The Local GEO Framework: Three Layers of AI Visibility</text>

<rect x="40" y="70" width="680" height="90" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="70" cy="115.0" r="14" fill="#B58CFF"/>
<text x="70" y="120.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">1</text>
<text x="100" y="100" font-size="15" font-weight="700" fill="#434C4A">Layer 1: Entity Authority</text>
<text x="100" y="119" font-size="12.5" fill="#6B7471">Can the AI confidently identify and validate the business?</text>
<text x="100" y="136" font-size="12.5" fill="#6B7471">Reviews, directory presence, profile completeness.</text>
<line x1="380.0" y1="160" x2="380.0" y2="188" stroke="#C9C4D4" stroke-width="2"/>
<polygon points="375.0,188 385.0,188 380.0,194" fill="#C9C4D4"/>

<rect x="40" y="194" width="680" height="90" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="70" cy="239.0" r="14" fill="#B58CFF"/>
<text x="70" y="244.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">2</text>
<text x="100" y="224" font-size="15" font-weight="700" fill="#434C4A">Layer 2: Semantic Relevance</text>
<text x="100" y="243" font-size="12.5" fill="#6B7471">Can the business satisfy the user&#x27;s specific request?</text>
<text x="100" y="260" font-size="12.5" fill="#6B7471">Service pages, content depth, intent alignment.</text>
<line x1="380.0" y1="284" x2="380.0" y2="312" stroke="#C9C4D4" stroke-width="2"/>
<polygon points="375.0,312 385.0,312 380.0,318" fill="#C9C4D4"/>

<rect x="40" y="318" width="680" height="90" rx="10" fill="#E4EAE9" stroke="#C9C4D4" stroke-width="1"/>
<circle cx="70" cy="363.0" r="14" fill="#B58CFF"/>
<text x="70" y="368.0" font-size="13" font-weight="700" fill="#FEFEFE" text-anchor="middle">3</text>
<text x="100" y="348" font-size="15" font-weight="700" fill="#434C4A">Layer 3: Citation Consensus</text>
<text x="100" y="367" font-size="12.5" fill="#6B7471">Do multiple independent AI systems agree this business deserves recommendation?</text>
<text x="100" y="384" font-size="12.5" fill="#6B7471">Cross-platform visibility.</text>
</svg>
